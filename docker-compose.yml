services:
  coach-bot:
    build: .
    container_name: coach-bot
    restart: unless-stopped
    mem_limit: 1g              # питон-поллер лёгкий, но процесс claude внутри тяжёлый
    user: "1000:1000"
    networks:
      - xray                   # выход к api.anthropic.com и OpenAI через мост 172.18.0.1:1080
    env_file:
      - .env
    environment:
      - BRAIN_DIR=/brain
      - STATE_DIR=/state
      - ARCHIVE_DB=/archive/coach.db
      - PROMPT_FILE=/plugin/prompts/coach.md
      # Остальные тексты поведения (чек-ины, дожимы, выжимки, ночная проверка,
      # подпись коммита, месячный итог) — там же, рядом с конституцией.
      - PROMPTS_DIR=/plugin/prompts
      - HOME=/home/coach
      # Конфиг движка (.claude.json) по умолчанию ложится РЯДОМ с домашней папкой,
      # то есть мимо тома ниже, и пропадает при каждом пересоздании контейнера.
      # Этой переменной движок кладёт его ВНУТРЬ /home/coach/.claude — в том.
      # Проверено живым тестом на движке 2.1.216.
      - CLAUDE_CONFIG_DIR=/home/coach/.claude
      # Пакет todoist-mcp приезжает не копией в образе, а смонтированным
      # клоном отдельного репо (см. volume /opt/pkg ниже). /app первым — код бота.
      - PYTHONPATH=/app:/opt/pkg:/opt/pkg-gcal
    volumes:
      - ./data/brain:/brain                        # клон gtd-coach-brain — мозг
      - ./data/state:/state                        # закладка разговора (session_id)
      - ./data/claude-config:/home/coach/.claude   # OAuth подписки, переживает рестарт
      - ./data/ssh:/home/coach/.ssh:ro             # deploy-ключ для push в мозг
      # Todoist-код — из отдельного репо vefmvai/todoist-mcp (один дом).
      # Серверный клон /opt/apps/todoist-mcp обновляется git pull с GitHub
      # (второй read-only deploy-ключ). Монтируем его src → /opt/pkg, PYTHONPATH
      # видит пакет todoist_mcp. Ключа в образе нет, build-time доступа нет.
      - /opt/apps/todoist-mcp/src:/opt/pkg:ro
      # Календарь — тоже отдельный репозиторий (один дом). До 01.08.2026 он был
      # питоном внутри образа, и второй канал жил без календаря вовсе.
      - /opt/apps/gcal-mcp/src:/opt/pkg-gcal:ro
      # Роль коуча — из отдельного репо vefmvai/gtd-coach (один дом). Тем же
      # приёмом, что и Todoist выше: клон на сервере обновляется git pull,
      # монтируется только на чтение. Маркетплейс контейнер не умеет — движок
      # в нём принимает лишь локальный путь. Плагин подхватывается на СЛЕДУЮЩЕЙ
      # сессии, поэтому выкатка всегда с рестартом.
      - /opt/apps/gtd-coach-plugin:/plugin:ro
      - archive:/archive                           # сырьё разговоров + выжимки (в бэкапе по имени тома)
    # Живость поллера: свежесть пульса главного цикла + ответ Telegram через прокси.
    # Подробности и обоснование — в src/healthcheck.py. Красный healthcheck сам
    # доезжает до владельца: хостовый сторож check-containers.sh шлёт алерт в Telegram.
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 120s
      timeout: 25s
      retries: 3
      start_period: 90s        # первый пульс — через секунду после старта, но образ тяжёлый
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  archive:

networks:
  xray:
    external: true
